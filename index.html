<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="keyrune.css"/>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        line-height: 1.5;
      }
      img, picture, video, canvas, svg {
        display: block;
        max-width: 100%;
      }
      input, button, textarea, select {
        font: inherit;
        height: 2.25rem;
      }
      .invalid {
        outline: 1px solid red;
      }
      a {
        color: orange;
      }
      main {
        color: white;
        font-size: 24px;

        min-height: 100vh;
        width: 100%;
        height: 100%;
        padding: 1rem 0;

        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;

        --s: 6px;
        --c1: #2b2229;
        --c2: #0E0909;
        --box-shadow-rgb: 0, 0, 0;
        --box-shadow: 0 6px 16px 0 rgba(var(--box-shadow-rgb), 0.08), 0 3px 6px -4px rgba(var(--box-shadow-rgb), 0.12), 0 9px 28px 8px rgba(var(--box-shadow-rgb), 0.05);

        --g:#0000 66%,var(--c1) 68% 98%,#0000;
        background:
            radial-gradient(30% 30% at 0%   30%,var(--g))
            var(--s) calc(9*var(--s)),
            radial-gradient(30% 30% at 100% 30%,var(--g))
            var(--s) calc(-1*var(--s)),
            radial-gradient(30% 30% at 30% 100%,var(--g))
            calc(10*var(--s)) 0,
            radial-gradient(30% 30% at 30% 0%  ,var(--g))
            var(--c2);
        background-size: calc(20*var(--s)) calc(20*var(--s));
      }
      button {
        width: min(40rem, 30vw);
        height: 3rem;

        color: #000;
        cursor: pointer;
        border: 3px solid;
        padding: 0.25em 0.5em;
        box-shadow: 1px 1px 0px 0px, 2px 2px 0px 0px, 3px 3px 0px 0px, 4px 4px 0px 0px, 5px 5px 0px 0px;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      button:active {
        box-shadow: 0px 0px 0px 0px;
        top: 5px;
        left: 5px;
      }
      .total-cards, .release-date {
        color: #FAF9F6;
        font-size: 1rem;
      }
      .chosen-set-header {
        width: 100%;
        height: 1rem;
        background: #0E0909;
        border-radius: 50% 50% 0 0;
        border: 2px solid orange;
        border-bottom: none;
      }
      .set-symbol {
        font-size: 3rem;
      }
      .set-name {
        text-align: center;
        line-clamp: 2;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }
      .set-block {
        color: silver;
        font-size: 0.9rem;
      }
      .expansion-code {
        color: silver;
        text-align: center;
      }
      .chosen-sets-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1rem;
        padding: 1rem;
        width: min(90vw, 70rem);
      }
      .header {
        border: 1px solid #3b3239;
        background-color: black;
        padding: 2rem;
        box-shadow: var(--box-shadow);
      }
      .chosen-set {
        background: #0E0909;
        border-radius: 0 0 0.5rem 0.5rem;
        display: grid;
        grid-template-rows: 1fr 1fr 1fr;
        justify-content: space-around;
        border: 2px solid #b89149;
        border-top: none;
        color: orange;
        font-weight: bold;
        gap: 0.5rem;
        box-shadow: var(--box-shadow);
        padding: 0.5rem;
      }
      .flex {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .flex-col {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
      }
      .form-body {
        border: 1px solid #3b3239;
        box-shadow: var(--box-shadow);
        background-color: black;
        display: grid;
        grid-template-columns: 2fr 3fr;
        gap: 0.5rem;
        padding: 2rem;
      }
      @media (max-width: 800px) {
        .form-body {
          grid-template-columns: 1fr;
        }
      }
      .action-row {
        border: 1px solid #3b3239;
        box-shadow: var(--box-shadow);
        gap: 3rem;
        background-color: black;
        padding: 2rem;
      }
      #links {
        display: none;
      }
      .date-row {
        display: grid;
        grid-template-columns: 1fr min-content 1fr;
        gap: 0.5rem;
      }
      .wrapper {
        position: absolute;
        top: 0;
        left: 0;
        min-height: 100vh;
        overflow: hidden;
        pointer-events: none;
      }
      .confetti {
        position: absolute;
        top: -100%;
      }
      @keyframes drop {
        100% {
          top: 110%;
        }
        0% {
          top: 0%;
        }
      }
    </style>

      function getLocalStorageValue(key, defaultIfNull) {
        const value = window.localStorage.getItem(key);
        if (!value) return defaultIfNull;
        try {
          return JSON.parse(value);
        } catch (e) {
          return defaultIfNull;
        }
      }

      window.bigSetThreshold = +getLocalStorageValue("big-set-threshold", 210);
      if (!Number.isInteger(window.bigSetThreshold)) { // checked for poisoned cache
        window.bigSetThreshold = 210;
        window.localStorage.removeItem("big-set-threshold");
      }
      window.disallowedSetCodes = getLocalStorageValue("disallowed-set-codes",  []);
      window.onlyPickBeforeDate = getLocalStorageValue("only-pick-before-date", "May 3, 2019"); // release date of War of the Spark
      window.onlyPickAfterDate  = getLocalStorageValue("only-pick-after-date",  "October 7, 1996"); // release date of Mirage

      function dateToString(date) { // in a way that is friendly for input[type=date]. How is this not a standard function?
        return `${date.getFullYear().toString().padStart(4, "0")}-${date.getMonth().toString().padStart(2, "0")}-${date.getDate().toString().padStart(2, "0")}`;
      }

      function handleDatePickerTextInputChange(e, datePicker) {
        e.target.classList.remove("invalid");
        let currentValue = "";
        const value = e.target.value.toLowerCase();
        for (const set of window.coreSets) {
          if (value == set["Expansion Code"].toLowerCase()) {
            currentValue = set["Release Date"];
            datePicker.value = dateToString(new Date(currentValue));
            return currentValue;
          }
        }
        for (const set of window.sets) {
          if (value == set["Expansion Code"].toLowerCase()) {
            currentValue = set["Release Date"];
            datePicker.value = dateToString(new Date(currentValue));
            return currentValue;
          }
        }
        if (currentValue == "") if (e.target.value.length > 0) e.target.classList.add("invalid");
        return currentValue;
      }

      document.addEventListener("DOMContentLoaded", () => {
        const bst = document.getElementById("bst");
        bst.value = window.bigSetThreshold;
        document.getElementById("bst-label").innerText = `Big Set Threshold (${window.bigSetThreshold}): `;
        bst.addEventListener("input", e => {
          window.bigSetThreshold = e.target.value;
          window.localStorage.setItem("big-set-threshold", e.target.value);
          document.getElementById("bst-label").innerText = `Big Set Threshold (${window.bigSetThreshold}): `;
        });

        const bsc = document.getElementById("bsc");
        bsc.addEventListener("input", e => {
          window.disallowedSetCodes = e.target.value.toLowerCase().split(/\s/);
          console.log("CHANGE bsc", window.disallowedSetCodes);
        });

        const otd = document.getElementById("otd");
        const ott = document.getElementById("ott");
        const ntt = document.getElementById("ntt");
        const ntd = document.getElementById("ntd");

        if (window.onlyPickBeforeDate) {
          otd.value = dateToString(new Date(window.onlyPickBeforeDate));
        }
        if (window.onlyPickAfterDate) {
          ntd.value = dateToString(new Date(window.onlyPickAfterDate));
        }

        // 'older-than' inputs:
        otd.addEventListener("change", e => {
          window.onlyPickBeforeDate = e.target.value;
        });
        ott.addEventListener("input", e => {
          window.onlyPickBeforeDate = handleDatePickerTextInputChange(e, otd);
          if (new Date(window.onlyPickAfterDate) > new Date(window.onlyPickBeforeDate)) {
            otd.classList.add("invalid");
            ntd.classList.add("invalid");
          }
        });
        // 'newer-than' inputs:
        ntd.addEventListener("change", e => {
          window.onlyPickAfterDate = e.target.value;
        });
        ntt.addEventListener("input", e => {
          window.onlyPickAfterDate = handleDatePickerTextInputChange(e, ntd);
          if (new Date(window.onlyPickAfterDate) > new Date(window.onlyPickBeforeDate)) {
            otd.classList.add("invalid");
            ntd.classList.add("invalid");
          }
        });
      });

      function setIsPickable(set) {
        for (const disallowed of window.disallowedSetCodes) {
          if (disallowed.toLowerCase().includes(set["Expansion Code"].toLowerCase())) {
            console.warn(`Skipping set ${set["Set"]} because it's explicitly disallowed. (Disallowed set codes are: ${window.disallowedSetCodes}).`);
            return false;
          }
        }
        if (window.onlyPickBeforeDate) {
          if (new Date(window.onlyPickBeforeDate) < new Date(set["Release Date"])) {
            console.warn(`Skipping set ${set["Set"]} because it's too new. (Asking for before ${window.onlyPickBeforeDate} and release date is: ${set["Release Date"]}).`);
            return false;
          }
        }
        if (window.onlyPickAfterDate) {
          if (new Date(window.onlyPickAfterDate) > new Date(set["Release Date"])) {
            console.warn(`Skipping set ${set["Set"]} because it's too old. (Asking for before ${window.onlyPickAfterDate} and release date is: ${set["Release Date"]}).`);
            return false;
          }
        }
        return true;
      }

      function spinTheWheel() {
        const grid = document.querySelector(".chosen-sets-grid");
        grid.innerHTML = "";

        const avoidSameBlock = document.getElementById("skip-same-block").checked;

        if (window.onlyPickAfterDate && window.onlyPickBeforeDate) {
          if (new Date(window.onlyPickBeforeDate) < new Date(window.onlyPickAfterDate)) {
            alert(`'Newer Than' date of ${window.onlyPickAfterDate} is after the 'Older Than' date of ${window.onlyPickBeforeDate}`);
            return;
          }
        }

        const coreSetOptions  = [];
        const smallSetOptions = [];
        const bigSetOptions   = [];

        for (const set of window.sets) {
          if (+set["Total Cards"] >= bigSetThreshold) {
            if (setIsPickable(set)) bigSetOptions.push(set);
          } else {
            if (setIsPickable(set)) smallSetOptions.push(set);
          }
        }
        for (const set of window.coreSets) {
          if (setIsPickable(set)) coreSetOptions.push(set);
        }

        if (coreSetOptions.length < 1) {
          alert("Not enough core set options with the configured settings! Tweak settings and try spinning again.");
          return;
        }
        if (smallSetOptions.length < 3) {
          alert("Not enough small set options with the configured settings! Tweak settings and try spinning again.");
          return;
        }
        if (bigSetOptions.length < 2) {
          alert("Not enough big set options with the configured settings! Tweak settings and try spinning again.");
          return;
        }

        let i = 0;
        const smallSetChoices = [];
        outer1: while (smallSetChoices.length < 3) {
          if (i > 20) {
            alert(`We tried a few times to find a valid small set, and failed! Tweak settings and try spining again. This could be due to a too restrictive date range.`);
            return;
          }
          i++;
          const choice = smallSetOptions[Math.floor(Math.random() * smallSetOptions.length)];
          if (smallSetChoices.includes(choice)) continue;
          if (window.disallowedSetCodes.includes(choice["Expansion Code"].toLowerCase())) continue;
          if (avoidSameBlock) {
            for (const set of smallSetChoices) {
                if (set["Block"] && set["Block"] == choice["Block"]) {
                console.warn(`Skipping small set ${choice["Set"]} because it's in the same block as another choice ${set["Set"]}`);
                continue outer1;
                }
            }
          }
          smallSetChoices.push(choice);
        }

        i = 0;
        const bigSetChoices = [];
        outer2: while (bigSetChoices.length < 2) {
          if (i > 20) {
            alert(`We tried a few times to find a valid big set, and failed! Tweak settings and try spining again. This could be due to a too restrictive date range.`);
            return;
          }
          i++;
          const choice = bigSetOptions[Math.floor(Math.random() * bigSetOptions.length)];
          if (bigSetChoices.includes(choice)) continue;
          if (avoidSameBlock) {
            for (const set of smallSetChoices) {
                if (set["Block"] && set["Block"] == choice["Block"]) {
                console.warn(`Skipping small set ${choice["Set"]} because it's in the same block as another choice ${set["Set"]}`);
                continue outer2;
                }
            }
            for (const set of bigSetChoices) {
                if (set["Block"] && set["Block"] == choice["Block"]) {
                console.warn(`Skipping big set ${choice["Set"]} because it's in the same block as another choice ${set["Set"]}`);
                continue outer2;
                }
            }
          }
          bigSetChoices.push(choice);
        }

        const coreSetChoice = coreSetOptions[Math.floor(Math.random() * coreSetOptions.length)];

        function appendSet(choice, label) {
          const c = document.createElement("div");
          c.innerHTML = `
            <div class="chosen-set-header"></div>
            <div class="chosen-set">
              <div class="flex-col">
                <h3 class="set-name" title="${choice.Set}">${choice.Set}</h3>
                <span class="set-block">${choice['Block'] ?? ''}</span>
              </div>

              <div class="flex">
                <i class="set-symbol ss ss-${choice['Expansion Code'].toLowerCase()}"></i>
                <span class="expansion-code">${choice["Expansion Code"]}</span>
              </div>

              <div class="flex-col">
                <span class="set-label">${label}</span>
                <span class="total-cards">${choice["Total Cards"]} Cards</span>
                <span class="release-date">Released: ${choice["Release Date"]}</span>
              </div>
            </div>
          `;
          grid.appendChild(c);
        }

        // append set cards
        for (const choice of bigSetChoices) {
          appendSet(choice, "Big Set");
        }
        appendSet(coreSetChoice, "Core Set");
        for (const choice of smallSetChoices) {
          appendSet(choice, "Small Set");
        }

        // construct links
        document.getElementById("links").style.display = "flex";
        const setCodes = [...bigSetChoices, coreSetChoice, ...smallSetChoices].map(s => s["Expansion Code"]);
        const scryfall = document.getElementById("scryfall");
        function constructScryfallLink() {
          let href = `https://scryfall.com/search?q=`;
          href += encodeURIComponent("(" + setCodes.map(c => "e:" + c).join(" or ") + ")");
          return href;
        }
        scryfall.href = constructScryfallLink();

        const dawnglare = document.getElementById("dawnglare");
        function constructDawnglareLink() {
          let href = "https://mtg.dawnglare.com/?p=viz&s=";
          href += encodeURIComponent("/?p=viz&s=" + setCodes.join("|"));
          return href;
        }
        dawnglare.href = constructDawnglareLink();

        if (document.getElementById("confetti-cb").checked) { // do confetti
          const w = document.querySelector(".wrapper");
          if (w) document.body.removeChild(w);
          function r(x) {
            return Math.floor(Math.random() * x);
          }

          const colors = [
            "orange", "red", "yellow", "pink", "magenta", "purple", "blue", "green", "lime", "salmon"
          ];
          const wrapper = document.createElement("div");
          wrapper.style.width = "100%";
          wrapper.classList.add("wrapper");
          for (let i = 0; i < 50; i++) {
            const c = document.createElement("div");
            c.classList.add("confetti");
            const w = r(10) + 5;
            const l = r(100) + 10;
            c.style.width = `${w}px`;
            c.style.height = `${w*0.4}px`;
            c.style.backgroundColor = colors[r(colors.length)];
            c.style.left = `${l}%`;
            c.style.transform = `rotate(${Math.random() * 360}deg)`;
            c.style.animationName = `drop`;
            c.style.animationDuration = `${10 * Math.random() + 5}s`
            //c.style.animationDelay = `${5 * Math.random()}s`;
            c.style.animationIterationCount = `${5}`;
            wrapper.appendChild(c);
          }
          document.body.appendChild(wrapper);
        }
      }
    </script>

  <body>
    <main>
      <div class="flex-col">
        <h1 class="header">MTG Set Roulette Generator</h1>

        <div class="form-body">
          <label id="bst-label" for="bst">Big Set Threshold (210): </label>
          <input id="bst" type="range" min="120" max="300" value="210" onchange="" />

          <label>Only Newer Than: </label>
          <div class="date-row">
            <input id="ntd" type="date" />
            <span>OR</span>
            <input id="ntt" type="text" placeholder="set code" />
          </div>

          <label>Only Older Than: </label>
          <div class="date-row">
            <input id="otd" type="date" />
            <span>OR</span>
            <input id="ott" type="text" placeholder="set code" />
          </div>

          <label for="bsc">Blacklisted Set Codes: </label>
          <input id="bsc" type="text" placeholder="set codes, space-separated" onchange="" />

          <label for="skip-same-block" title="If enabled, you won't be able to roll multiple big/small sets from the same block.">Avoid Same Block:</label>
          <input id="skip-same-block" type="checkbox" checked/>
        </div>

        <div class="flex action-row">
          <div class="flex">
            <label for="confetti-cb">Fanfare?</label>
            <input id="confetti-cb" type="checkbox" />
          </div>

          <button onclick="spinTheWheel()">Spin the wheel!</button>
        </div>
      </div>
      <div class="chosen-sets-grid"></div>
      <div id="links" class="flex action-row">
        <a id="scryfall" target="_blank" href="https://scryfall.com">Scryfall</a>
        <a id="dawnglare" target="_blank">Dawnglare Visualizer</a>
      </div>
    </main>
    <noscript>This site requires Javascript, sorry :(</noscript>
